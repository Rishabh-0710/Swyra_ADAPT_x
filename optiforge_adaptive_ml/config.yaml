# OPTIFORGE Continuous Tabular Learning Configuration

system:
  random_seed: 42
  verbose: false

memory:
  max_replay_samples: 500
  strategy: "stratified_density"  # Options: stratified_density, reservoir, fifo
  n_strata: 10
  diversity_metric: "euclidean"

drift_detection:
  psi_threshold_low: 0.10
  psi_threshold_high: 0.25
  wasserstein_threshold: 0.20
  residual_cusum_threshold: 3.5
  confidence_alpha: 0.05
  min_samples_for_detection: 50

adaptation:
  min_adaptation_rate: 0.10
  max_adaptation_rate: 1.00
  core_tree_boost_multiplier: 1.5
  specialist_weight_max: 0.70
  replay_blend_ratio_min: 0.20
  replay_blend_ratio_max: 0.50

model:
  core_learning_rate: 0.05
  specialist_learning_rate: 0.08
  max_trees_core: 150
  max_trees_specialist: 60
  num_leaves: 31
  min_child_samples: 20
  l2_regularization: 1.5

multi_objective_weights:
  predictive_performance: 0.40
  robustness_across_shifts: 0.25
  calibration: 0.15
  fairness_subgroup_consistency: 0.10
  computational_efficiency: 0.10
